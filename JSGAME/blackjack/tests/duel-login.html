<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地双人验收登录</title><body><h1>仅用于本地验收</h1><p>需要启动 duel-test-server.mjs；这些身份不能登录正式服务。</p><button data-user="alice">以 Alice 进入觉醒桌</button><button data-user="bob">以 Bob 进入觉醒桌</button><button data-user="carol">以 Carol 进入传统桌</button><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{localStorage.setItem('gao-lab-auth-token-v1',button.dataset.user);document.cookie='gao_lab_session='+button.dataset.user+'; Path=/; SameSite=Lax';sessionStorage.removeItem('blackjack-duel-client');location.href='/?table='+ (button.dataset.user==='carol'?'table-11':'table-6');};</script></body></html>
